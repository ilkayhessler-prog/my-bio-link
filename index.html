<style>
/* =====================================================================
   DESIGN TOKENS
   ===================================================================== */
:root {
  --bg: #0a0a0a;
  --violet: #8b5cf6;
  --pink: #ec4899;
  --text: #f4f1ff;
  --muted: rgba(244, 241, 255, 0.62);
  --glass: rgba(255, 255, 255, 0.045);
  --glass-hover: rgba(139, 92, 246, 0.14);
  --glass-border: rgba(255, 255, 255, 0.1);
  --grad: linear-gradient(135deg, var(--violet), var(--pink));
  --font-display: "Orbitron", "Poppins", system-ui, sans-serif;
  --font-body: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); color-scheme: dark; }
body {
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  overflow-x: hidden;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 48px 16px 120px;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

/* Hide the native cursor only when the custom one is active (set by JS) */
html.custom-cursor, html.custom-cursor a, html.custom-cursor button { cursor: none; }

/* =====================================================================
   BACKGROUND LAYERS
   ===================================================================== */
.bg-layer { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
#particles { width: 100%; height: 100%; display: block; }

/* Animated gradient mode */
.bg-gradient {
  background:
    radial-gradient(60% 60% at 20% 20%, rgba(139, 92, 246, 0.35), transparent 60%),
    radial-gradient(55% 55% at 80% 30%, rgba(236, 72, 153, 0.28), transparent 60%),
    radial-gradient(60% 60% at 50% 90%, rgba(99, 52, 220, 0.3), transparent 60%),
    var(--bg);
  background-size: 160% 160%, 160% 160%, 160% 160%, 100% 100%;
  animation: gradShift 18s ease-in-out infinite alternate;
  display: none;
}
@keyframes gradShift {
  0%   { background-position: 0% 0%, 100% 0%, 50% 100%, 0 0; }
  100% { background-position: 100% 100%, 0% 100%, 50% 0%, 0 0; }
}

/* Custom image mode */
.bg-image {
  background-size: cover;
  background-position: center;
  display: none;
}
.bg-image::after {
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(circle at center, rgba(10,10,10,0.55), rgba(10,10,10,0.9));
}

/* Soft vignette over everything for depth */
.vignette {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.65) 100%);
}

/* =====================================================================
   MAIN CARD
   ===================================================================== */
main {
  position: relative; z-index: 2;
  width: 100%; max-width: 440px;
  padding: 32px 22px 26px;
  border-radius: 28px;
  background: rgba(14, 12, 22, 0.45);
  border: 1px solid var(--glass-border);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  backdrop-filter: blur(18px) saturate(140%);
  box-shadow: 0 20px 80px rgba(0,0,0,0.6), 0 0 60px rgba(139, 92, 246, 0.12);
  text-align: center;
  animation: cardIn 0.9s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes cardIn { from { opacity: 0; transform: translateY(24px) scale(.97); } to { opacity: 1; transform: none; } }

/* =====================================================================
   PROFILE
   ===================================================================== */
.avatar-wrap {
  position: relative;
  width: 124px; height: 124px;
  margin: 0 auto 18px;
  border-radius: 50%;
}
/* Rotating glowing ring */
.avatar-wrap::before {
  content: ""; position: absolute; inset: -5px; border-radius: 50%;
  background: conic-gradient(from 0deg, var(--violet), var(--pink), #22d3ee, var(--violet));
  animation: spin 4s linear infinite;
  filter: blur(0.3px);
}
.avatar-wrap::after { /* blurred glow behind ring */
  content: ""; position: absolute; inset: -10px; border-radius: 50%;
  background: conic-gradient(from 0deg, var(--violet), var(--pink), #22d3ee, var(--violet));
  animation: spin 4s linear infinite;
  filter: blur(18px); opacity: 0.55; z-index: -1;
}
@keyframes spin { to { transform: rotate(360deg); } }
.avatar {
  position: relative; z-index: 1;
  width: 100%; height: 100%;
  border-radius: 50%;
  object-fit: cover;
  border: 4px solid var(--bg);

  display: block;

/* Username with glitch + shimmer */
.username {
  position: relative;
  display: inline-block;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(2rem, 9vw, 2.6rem);
  letter-spacing: 0.08em;
  background: linear-gradient(90deg, #fff 0%, #c4b5fd 25%, var(--pink) 50%, #c4b5fd 75%, #fff 100%);
  background-size: 250% 100%;
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
  animation: shimmer 5s linear infinite;
  text-shadow: none;
  filter: drop-shadow(0 0 14px rgba(139, 92, 246, 0.55));
}
@keyframes shimmer { to { background-position: -250% 0; } }
.username::before, .username::after {
  content: attr(data-text);
  position: absolute; inset: 0;
  -webkit-text-fill-color: currentColor;
  background: none;
  opacity: 0;
  pointer-events: none;
}
.username::before { color: #22d3ee; animation: glitchA 6s infinite steps(1); }
.username::after  { color: var(--pink); animation: glitchB 6s infinite steps(1); }
@keyframes glitchA {
  0%, 92%, 100% { opacity: 0; transform: none; clip-path: inset(0 0 0 0); }
  93% { opacity: .8; transform: translate(-3px, 1px); clip-path: inset(10% 0 55% 0); }
  95% { opacity: .8; transform: translate(3px, -1px); clip-path: inset(60% 0 8% 0); }
  97% { opacity: 0; }
}
@keyframes glitchB {
  0%, 92%, 100% { opacity: 0; transform: none; clip-path: inset(0 0 0 0); }
  94% { opacity: .8; transform: translate(3px, -1px); clip-path: inset(40% 0 30% 0); }
  96% { opacity: .8; transform: translate(-3px, 1px); clip-path: inset(5% 0 70% 0); }
  98% { opacity: 0; }

.dot {

@keyframes ping { 0% { transform: scale(1); opacity: .8; } 80%, 100% { transform: scale(3); opacity: 0; } }

.bio {

@keyframes blink { 50% { opacity: 0; } }

.links { display: flex; flex-direction: column; gap: 12px; margin-top: 26px; }
.link {

  position: relative; overflow: hidden;
  display: flex; align-items: center; gap: 14px;
  padding: 14px 18px;
  border-radius: 16px;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  font-weight: 500; font-size: 0.98rem; text-align: left;
  opacity: 0;
  animation: linkIn 0.6s cubic-bezier(.2,.8,.2,1) forwards;
  animation-delay: calc(0.35s + var(--i) * 0.07s);
  transition: transform .25s cubic-bezier(.2,.8,.2,1), border-color .25s, box-shadow .25s, background .25s;
}
@keyframes linkIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
/* Light sweep on hover */
.link::before {
  content: ""; position: absolute; top: 0; left: -120%; width: 80%; height: 100%;
  background: linear-gradient(100deg, transparent, rgba(255,255,255,0.14), transparent);
  transform: skewX(-20deg);
  transition: left .6s ease;
}
.link:hover, .link:focus-visible {
  transform: translateY(-4px);
  background: var(--glass-hover);
  border-color: rgba(236, 72, 153, 0.75);
  box-shadow: 0 0 0 1px rgba(139,92,246,.5), 0 0 22px rgba(139,92,246,.55), 0 10px 36px rgba(236,72,153,.28);
  outline: none;
}
.link:hover::before, .link:focus-visible::before { left: 150%; }
.link:active { transform: translateY(-1px) scale(.985); }
.link svg { width: 22px; height: 22px; flex: none; fill: currentColor; transition: color .25s, filter .25s; }
.link svg.stroke { fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.link:hover svg { color: #f9a8d4; filter: drop-shadow(0 0 6px var(--pink)); }
.link .name { flex: 1; }
.link .arrow { opacity: 0; transform: translateX(-6px); transition: .25s; width: 18px; height: 18px; }
.link:hover .arrow { opacity: .9; transform: none; }

/* =====================================================================
   FOOTER / SHARE
   ===================================================================== */
.footer { margin-top: 26px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.pill-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 16px; border-radius: 999px;
  font-size: 0.78rem; letter-spacing: 0.05em;
  color: var(--muted);
  background: var(--glass); border: 1px solid var(--glass-border);

  transition: .25s;
}
.pill-btn:hover, .pill-btn:focus-visible {
  color: #fff; border-color: var(--violet);
  box-shadow: 0 0 18px rgba(139,92,246,.5); transform: translateY(-2px); outline: none;
}
.pill-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.brand { font-size: 0.68rem; letter-spacing: 0.12em; color: rgba(244,241,255,0.28); }

/* =====================================================================
   SOUND TOGGLE (top-right)
   ===================================================================== */
.sound-toggle {
  position: fixed; top: 16px; right: 16px; z-index: 20;
  width: 42px; height: 42px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--glass); border: 1px solid var(--glass-border);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  transition: .25s;
}
.sound-toggle:hover, .sound-toggle:focus-visible { border-color: var(--pink); box-shadow: 0 0 18px rgba(236,72,153,.55); outline: none; }
.sound-toggle svg { width: 19px; height: 19px; fill: none; stroke: #e9e2ff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.sound-toggle .waves { transition: opacity .2s; }
.sound-toggle.off .waves { opacity: 0; }
.sound-toggle .mute-x { opacity: 0; transition: opacity .2s; }
.sound-toggle.off .mute-x { opacity: 1; }

/* =====================================================================
   MUSIC PLAYER (bottom-left, floating)
   ===================================================================== */
.player {
  position: fixed; left: 16px; bottom: 16px; z-index: 20;
  display: flex; align-items: center; gap: 12px;
  width: min(300px, calc(100vw - 32px));
  padding: 10px 14px 12px 10px;
  border-radius: 18px;

.play-btn {

.play-btn:hover, .play-btn:focus-visible { transform: scale(1.08); box-shadow: 0 0 26px rgba(236,72,153,.85); outline: none; }

.player.playing .play-btn .i-play { display: none; }
.player.playing .play-btn .i-pause { display: block; }
.track { flex: 1; min-width: 0; }
.track-title {

.track-sub { font-size: 0.65rem; color: var(--muted); letter-spacing: .06em; margin-top: 1px; }
#viz { flex: none; width: 64px; height: 28px; display: block; }
.progress { position: absolute; left: 0; bottom: 0; height: 2px; width: 0%; background: var(--grad); }

/* =====================================================================
   CUSTOM CURSOR
   ===================================================================== */
.cursor-dot, .cursor-glow {
  position: fixed; top: 0; left: 0; z-index: 9999;
  pointer-events: none; border-radius: 50%;
  opacity: 0; transition: opacity .3s;
  will-change: transform;
}
.cursor-dot { width: 8px; height: 8px; margin: -4px 0 0 -4px; background: #fff; box-shadow: 0 0 10px var(--pink), 0 0 20px var(--violet); }
.cursor-glow {
  width: 38px; height: 38px; margin: -19px 0 0 -19px;

}
html.custom-cursor.cursor-ready .cursor-dot,
html.custom-cursor.cursor-ready .cursor-glow { opacity: 1; }
.cursor-glow.active { width: 56px; height: 56px; margin: -28px 0 0 -28px; transition: width .2s, height .2s, margin .2s, opacity .3s; }

/* =====================================================================
   TOAST
   ===================================================================== */
.toast {
  position: fixed; left: 50%; bottom: 90px; z-index: 30;
  transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  padding: 10px 18px; border-radius: 999px; font-size: .8rem;
  background: rgba(20, 16, 32, .85); border: 1px solid var(--violet);
  box-shadow: 0 0 22px rgba(139,92,246,.5);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  transition: .35s cubic-bezier(.2,.8,.2,1);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* =====================================================================
   RESPONSIVE
   ===================================================================== */
@media (max-width: 480px) {
  body { padding: 28px 12px 130px; }
  main { padding: 26px 16px 22px; border-radius: 24px; }

  .link { padding: 13px 15px; }
  .sound-toggle { top: 12px; right: 12px; }
  .player { left: 12px; bottom: 12px; width: calc(100vw - 24px); }
  .toast { bottom: 84px; }
}
@media (min-width: 481px) { body { padding-top: 7vh; } }

/* Respect reduced-motion preferences */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}
</style>

  get(k)   { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k,v) { try { localStorage.setItem(k, v); } catch (e) {} }
};

/* =====================================================================
   SOUND ENGINE — Web Audio API, all sounds synthesized (no files)
   ===================================================================== */
const Sound = (() => {
  let ctx = null;
  let enabled = CONFIG.soundsEnabled;
  const saved = store.get("flowwz_sounds");
  if (saved !== null) enabled = saved === "1";

  // AudioContext must be created/resumed after a user gesture
  function ensureCtx() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { ctx = new AC(); } catch (e) { return null; }
    }
    if (ctx.state === "suspended") ctx.resume().catch(() => {});
    return ctx;
  }

  // Play a short enveloped tone with optional pitch sweep
  function blip({ f1, f2, dur, type = "sine", vol = 0.05 }) {
    if (!enabled) return;
    const c = ensureCtx();
    if (!c) return;
    const t = c.currentTime;
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(f1, t);
    osc.frequency.exponentialRampToValueAtTime(f2, t + dur);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(c.destination);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  }

  return {
    get enabled() { return enabled; },
    set(v) { enabled = !!v; store.set("flowwz_sounds", enabled ? "1" : "0"); },
    hover() { blip({ f1: 660, f2: 990, dur: 0.07, type: "sine", vol: 0.025 }); },
    click() {
      blip({ f1: 420, f2: 180, dur: 0.11, type: "triangle", vol: 0.07 });
      setTimeout(() => blip({ f1: 880, f2: 1320, dur: 0.06, type: "sine", vol: 0.03 }), 25);
    },
    unlock() { if (enabled) ensureCtx(); }
  };
})();

  $("statusText").textContent = CONFIG.statusText;

  const av = $("avatar");
  const fallback = "data:image/svg+xml," + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/></linearGradient></defs><rect width="200" height="200" fill="url(#g)"/><text x="100" y="128" font-family="Arial,sans-serif" font-size="96" font-weight="700" fill="#fff" text-anchor="middle">${(CONFIG.username[0] || "v").toUpperCase()}</text></svg>`
  );
  av.onerror = () => { av.onerror = null; av.src = fallback; };
  av.src = CONFIG.avatar || fallback;
  av.alt = CONFIG.username + " profile picture";
}

function renderLinks() {
  const wrap = $("links");
  CONFIG.links.forEach((l, i) => {
    const p = PLATFORMS[l.platform];
    if (!p) return; // ignore unknown platforms
    const a = document.createElement("a");
    a.className = "link";
    a.href = l.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.style.setProperty("--i", i);
    a.setAttribute("aria-label", l.label || p.name);
    a.innerHTML = p.svg + `<span class="name"></span>` + ARROW_SVG;
    a.querySelector(".name").textContent = l.label || p.name;
    wrap.appendChild(a);
  });
}

   TYPEWRITER BIO
   ===================================================================== */
let typeTimer = null;
function typeBio() {
  const el = $("bioText");
  const text = CONFIG.bio;
  if (reduceMotion) { el.textContent = text; return; }
  let i = 0;
  const chars = Array.from(text); // handles emoji / unicode correctly
  function tick() {
    el.textContent = chars.slice(0, ++i).join("");
    if (i < chars.length) typeTimer = setTimeout(tick, CONFIG.typeSpeed + Math.random() * 35);
  }
  typeTimer = setTimeout(tick, 700); // wait for the card entrance
}

/* =====================================================================
   VISITOR COUNTER
   ===================================================================== */
async function initVisitorCounter() {
  const cfg = CONFIG.counter;
  const box = $("visitors"), num = $("visitorNum");
  if (!cfg.enabled) { box.style.display = "none"; return; }

  const show = (n) => {
    // Quick count-up animation for flair
    const target = Number(n);
    if (reduceMotion || !isFinite(target)) { num.textContent = "#" + target.toLocaleString("en-US"); return; }
    const start = performance.now(), from = Math.max(0, target - 40), dur = 900;
    (function step(now) {
      const t = Math.min(1, (now - start) / dur);
      num.textContent = "#" + Math.round(from + (target - from) * (1 - Math.pow(1 - t, 3))).toLocaleString("en-US");
      if (t < 1) requestAnimationFrame(step);
    })(start);
  };

  /* ---------- OPTION A (default): local counter via localStorage ----------
     Only counts once per browser session so refreshing doesn't inflate it.
     NOTE: this is per-browser, not global. Use Option B for a real shared count. */
  let n = parseInt(store.get("flowwz_visits"), 10);
  if (!isFinite(n)) n = cfg.startAt;
  let counted = false;
  try { counted = sessionStorage.getItem("flowwz_counted") === "1"; } catch (e) {}
  if (!counted) {
    n += 1;
    store.set("flowwz_visits", String(n));
    try { sessionStorage.setItem("flowwz_counted", "1"); } catch (e) {}
  }
  show(n);

  /* ---------- OPTION B: global counter across all visitors ----------
     1) Delete/disable OPTION A above.
     2) Uncomment this block. counterapi.dev's v1 endpoint increments a named
        counter on each GET to /up and returns JSON like { "count": 123, ... }.
        Check https://counterapi.dev for the current API shape before shipping,
        as free services change over time.

  try {
    const url = `https://api.counterapi.dev/v1/${cfg.namespace}/${cfg.key}/up`;
    const res = await fetch(url);
    if (!res.ok) throw new Error("counter HTTP " + res.status);
    const data = await res.json();
    show(data.count);
  } catch (err) {
    console.warn("Visitor counter failed, falling back to local:", err);
    show(n); // fall back to the local number
  }
  */
}

/* =====================================================================
   BACKGROUND — particles / gradient / image
   ===================================================================== */
const Background = (() => {
  const canvas = $("particles");
  const ctx = canvas.getContext("2d");
  let w = 0, h = 0, dpr = 1, particles = [], raf = 0, running = false;
  const mouse = { x: -9999, y: -9999 };

  const COUNT = isMobile ? 38 : 90;       // fewer particles on mobile for performance
  const LINK_DIST = isMobile ? 95 : 130;  // distance for connecting lines
  const COLORS = ["139,92,246", "236,72,153", "196,181,253"];

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, isMobile ? 1.5 : 2);
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    canvas.style.width = w + "px"; canvas.style.height = h + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // (re)seed particles proportional to the viewport area, capped by COUNT
    const target = Math.max(20, Math.min(COUNT, Math.round((w * h) / 16000)));
    while (particles.length < target) particles.push(makeParticle());
    particles.length = Math.min(particles.length, target);
  }

  function makeParticle() {
    return {
      x: Math.random() * w, y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.35, vy: (Math.random() - 0.5) * 0.35,
      r: Math.random() * 1.8 + 0.7,
      c: COLORS[(Math.random() * COLORS.length) | 0],
      tw: Math.random() * Math.PI * 2 // twinkle phase
    };
  }

  function frame(t) {
    if (!running) return;
    ctx.clearRect(0, 0, w, h);

    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy;
      // wrap around edges
      if (p.x < -10) p.x = w + 10; else if (p.x > w + 10) p.x = -10;
      if (p.y < -10) p.y = h + 10; else if (p.y > h + 10) p.y = -10;

      // gentle repulsion from the mouse (desktop)
      const dx = p.x - mouse.x, dy = p.y - mouse.y, d2 = dx * dx + dy * dy;
      if (d2 < 14000) { const d = Math.sqrt(d2) || 1, f = (1 - d / 118) * 0.6; p.x += (dx / d) * f; p.y += (dy / d) * f; }

      // soft glowing dot
      const a = 0.55 + Math.sin(t / 900 + p.tw) * 0.25;
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 5);
      g.addColorStop(0, `rgba(${p.c},${a})`);
      g.addColorStop(1, `rgba(${p.c},0)`);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 5, 0, 6.2832); ctx.fill();
      ctx.fillStyle = `rgba(255,255,255,${a})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 0.7, 0, 6.2832); ctx.fill();

      // connecting lines to close neighbours
      for (let j = i + 1; j < particles.length; j++) {
        const q = particles[j];
        const lx = p.x - q.x, ly = p.y - q.y, ld = lx * lx + ly * ly;
        if (ld < LINK_DIST * LINK_DIST) {
          const o = (1 - Math.sqrt(ld) / LINK_DIST) * 0.28;
          ctx.strokeStyle = `rgba(${p.c},${o})`;
          ctx.lineWidth = 0.8;
          ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
        }
      }
    }
    raf = requestAnimationFrame(frame);
  }

  function start() { if (running) return; running = true; raf = requestAnimationFrame(frame); }
  function stop()  { running = false; cancelAnimationFrame(raf); }

  let resizeTimer;
  window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 150); });
  window.addEventListener("pointermove", (e) => { mouse.x = e.clientX; mouse.y = e.clientY; }, { passive: true });
  window.addEventListener("pointerleave", () => { mouse.x = mouse.y = -9999; });
  // Pause animation when the tab is hidden to save battery/CPU
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) stop();
    else if (CONFIG.backgroundMode === "particles") start();
  });

  // Apply the selected background mode from CONFIG
  function apply() {
    const mode = CONFIG.backgroundMode;
    $("bgGradient").style.display = mode === "gradient" ? "block" : "none";
    const img = $("bgImage");
    if (mode === "image") { img.style.backgroundImage = `url("${CONFIG.backgroundImage}")`; img.style.display = "block"; }
    else img.style.display = "none";

    if (mode === "particles" && !reduceMotion) { $("bgParticles").style.display = "block"; resize(); start(); }
    else { stop(); $("bgParticles").style.display = "none"; }
  }
  return { apply };
})();

/* =====================================================================
   CUSTOM CURSOR (desktop only)
   ===================================================================== */
function initCursor() {
  if (isTouch) {
    $("cursorDot").remove(); $("cursorGlow").remove();
    return;
  }
  const root = document.documentElement;
  const dot = $("cursorDot"), glow = $("cursorGlow");
  root.classList.add("custom-cursor");
  let mx = 0, my = 0, gx = 0, gy = 0, raf = 0, active = false;

  window.addEventListener("pointermove", (e) => {
    mx = e.clientX; my = e.clientY;
    dot.style.transform = `translate(${mx}px, ${my}px)`;
    if (!root.classList.contains("cursor-ready")) { gx = mx; gy = my; root.classList.add("cursor-ready"); }
    if (!active) { active = true; raf = requestAnimationFrame(loop); }
  }, { passive: true });

  // Trailing glow eases toward the pointer; loop pauses itself once it has caught up
  function loop() {
    gx += (mx - gx) * 0.16; gy += (my - gy) * 0.16;
    glow.style.transform = `translate(${gx}px, ${gy}px)`;
    if (Math.abs(mx - gx) > 0.1 || Math.abs(my - gy) > 0.1) raf = requestAnimationFrame(loop);
    else active = false;
  }

  // Enlarge the glow over interactive elements
  document.addEventListener("pointerover", (e) => {
    glow.classList.toggle("active", !!e.target.closest("a, button"));
  });
  document.addEventListener("mouseleave", () => root.classList.remove("cursor-ready"));
  document.addEventListener("mouseenter", () => root.classList.add("cursor-ready"));
}

/* =====================================================================
   MUSIC PLAYER + FAKE VISUALIZER
   ===================================================================== */
function initPlayer() {
  const m = CONFIG.music || {};
  const player = $("player"), btn = $("playBtn");
  const title = $("trackTitle"), sub = $("trackSub"), prog = $("progress");
  const canvas = $("viz"), c = canvas.getContext("2d");

  title.textContent = (m.title || "untitled") + (m.artist ? " — " + m.artist : "");
  sub.textContent = "paused";

  if (!m.src) { player.style.display = "none"; return; }

  const audio = new Audio();
  audio.preload = "none";
  audio.loop = m.loop !== false;
  audio.volume = Math.min(1, Math.max(0, m.volume ?? 0.5));
  audio.src = m.src;

  let playing = false, broken = false;

  function setPlaying(v) {
    playing = v;
    player.classList.toggle("playing", v);
    sub.textContent = broken ? "track unavailable · check CONFIG.music.src" : (v ? "now playing" : "paused");
  }

  btn.addEventListener("click", async () => {
    if (broken) { toast("couldn't load the track — check CONFIG.music.src"); return; }
    if (playing) { audio.pause(); return; }
    try { await audio.play(); } catch (err) { broken = true; setPlaying(false); }
  });
  audio.addEventListener("play",  () => setPlaying(true));
  audio.addEventListener("pause", () => setPlaying(false));
  audio.addEventListener("error", () => { broken = true; setPlaying(false); });
  audio.addEventListener("timeupdate", () => {
    if (audio.duration) prog.style.width = (audio.currentTime / audio.duration * 100) + "%";
  });

  // Fake waveform: bouncing bars driven by layered sine waves (no real audio analysis)
  const BARS = 14;
  const heights = new Array(BARS).fill(0.08);
  const phases = Array.from({ length: BARS }, () => Math.random() * 10);
  let raf = 0;
  function draw(t) {
    const W = canvas.width, H = canvas.height, bw = W / BARS;
    c.clearRect(0, 0, W, H);
    const grad = c.createLinearGradient(0, H, 0, 0);
    grad.addColorStop(0, "#8b5cf6"); grad.addColorStop(1, "#ec4899");
    c.fillStyle = grad;
    let settled = true;
    for (let i = 0; i < BARS; i++) {
      const s = t / 1000;
      const target = playing
        ? 0.18 + 0.82 * Math.abs(Math.sin(s * (2.2 + i * 0.35) + phases[i]) * 0.6 + Math.sin(s * 5.1 + i) * 0.4)
        : 0.08;
      heights[i] += (target - heights[i]) * 0.2;
      if (Math.abs(target - heights[i]) > 0.01) settled = false;
      const bh = Math.max(3, heights[i] * H);
      const x = i * bw + bw * 0.18, bwid = bw * 0.64, r = bwid / 2;
      // rounded bar, vertically centred
      c.beginPath();
      c.roundRect ? c.roundRect(x, (H - bh) / 2, bwid, bh, r) : c.rect(x, (H - bh) / 2, bwid, bh);
      c.fill();
    }
    // stop requesting frames once paused and bars have settled
    if (playing || !settled) raf = requestAnimationFrame(draw); else raf = 0;
  }
  // (re)start the draw loop whenever playback state changes
  const kick = () => { if (!raf && !reduceMotion) raf = requestAnimationFrame(draw); };
  audio.addEventListener("play", kick);
  audio.addEventListener("pause", kick);
  kick();

  // Pause the visualizer loop while the tab is hidden
  document.addEventListener("visibilitychange", () => { if (!document.hidden) kick(); else { cancelAnimationFrame(raf); raf = 0; } });
}

/* =====================================================================
   SHARE / COPY LINK
   ===================================================================== */
let toastTimer;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

function initShare() {
  $("shareBtn").addEventListener("click", async () => {
    const url = location.href;
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(url);
      } else {
        // Fallback for file:// and older browsers
        const ta = document.createElement("textarea");
        ta.value = url; ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select();
        const ok = document.execCommand("copy");
        ta.remove();
        if (!ok) throw new Error("copy failed");
      }
      toast("link copied ✦");
      $("shareLabel").textContent = "copied!";
      setTimeout(() => ($("shareLabel").textContent = "copy link"), 1800);
    } catch (e) {
      // Last resort: native share sheet (mobile) or manual copy prompt
      if (navigator.share) { navigator.share({ title: "flowwz.lol", url }).catch(() => {}); }
      else window.prompt("Copy this link:", url);
    }
  });
}

/* =====================================================================
   SOUND WIRING (hover + click + toggle)
   ===================================================================== */
function initSounds() {
  const toggle = $("soundToggle");
  const sync = () => { toggle.classList.toggle("off", !Sound.enabled); toggle.setAttribute("aria-pressed", String(Sound.enabled)); };
  sync();

  toggle.addEventListener("click", () => {
    Sound.set(!Sound.enabled);
    sync();
    if (Sound.enabled) Sound.click(); // audible confirmation
  });

  // Browsers block audio until the first gesture — unlock on first interaction
  window.addEventListener("pointerdown", () => Sound.unlock(), { once: true });

  // Hover blips (mouse only — touch has no hover)
  document.addEventListener("pointerenter", (e) => {
    if (e.pointerType && e.pointerType !== "mouse") return;
    if (e.target.closest && e.target.closest(".link, .pill-btn, .play-btn, .sound-toggle")) Sound.hover();
  }, true);

  // Click blips
  document.addEventListener("click", (e) => {
    if (e.target.closest(".link, .pill-btn, .play-btn")) Sound.click();
  });
}

/* =====================================================================
   BOOT
   ===================================================================== */
function init() {
  initProfile();
  renderLinks();
  Background.apply();
  initCursor();
  initSounds();
  initPlayer();
  initShare();
  initVisitorCounter();
  typeBio();
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
else init();

// Clean up timers when leaving the page
window.addEventListener("pagehide", () => { clearTimeout(typeTimer); clearTimeout(toastTimer); });
</script>
